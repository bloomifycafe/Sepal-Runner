name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # Tests that need the golden set, the checkpoint or a Sepal checkout skip themselves when those are absent.
      - run: python -m pytest -q

  engine-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-11
      - run: cmake --preset release && cmake --build --preset release && ctest --preset release --output-on-failure
        working-directory: runner
        env:
          CXX: g++-11

  engine-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja -y
      - run: cmake --preset release && cmake --build --preset release && ctest --preset release --output-on-failure
        working-directory: runner
        shell: cmd

  # The CUDA backend (runner/cuda) and the golden-set parity need a GPU box and the model files; they are run by hand (see README.md).
